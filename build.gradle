plugins { id 'fabric-loom' version '1.11.8' }

version = '0.1.0+1.21.6'
group = 'local.companions'
base { archivesName = 'companion-mailbox' }

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/'; content { includeGroup 'io.papermc.paper'; includeGroup 'net.md-5' } }
}
sourceSets { server }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.6'
    mappings 'net.fabricmc:yarn:1.21.6+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.20.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.128.2+1.21.6'
    serverCompileOnly 'io.papermc.paper:paper-api:1.21.6-R0.1-SNAPSHOT'
    serverCompileOnly 'com.google.code.gson:gson:2.11.0'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { withSourcesJar() }
jar { from('LICENSE') }
tasks.register('serverJar', Jar) {
    archiveBaseName = 'companion-rules'
    from sourceSets.server.output
    from('LICENSE')
}
tasks.named('build') { dependsOn 'serverJar' }
loom { runs { client { client(); runDir 'run' } } }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'companion-mailbox-tests'
        enableGameTests = false
        enableClientGameTests = true
        clearRunDirectory = false
        username = 'LocalPlayer'
    }
}
loom {
    runs {
        clientGameTest { vmArg '-Dfabric.client.gametest.disableNetworkSynchronizer=true' }
    }
}
